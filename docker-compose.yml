version: "3.9"

services:
  api:
    build: .
    container_name: projexa-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: projexa-mongo
    restart: always
    volumes:
      - mongo_data:/data/db
    command: ["mongod", "--replSet", "rs0"]

volumes:
  mongo_data:
